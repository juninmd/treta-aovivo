[package]
name = "treta-aovivo"
version = "0.1.0"
description = "Live debate transcription with speaker diarization, fallacy detection and fact-checking"
authors = ["juninmd"]
edition = "2024"
default-run = "treta-aovivo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "treta_aovivo_lib"
# Desktop only: staticlib/cdylib (mobile targets) re-archive the whole static
# sherpa-onnx runtime on every build and made each build take ~10 minutes.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "=2.0.0"
cpal = "0.18"
base64 = "0.22"
anyhow = "1"
keyring = "4"
sha2 = "0.10"
rustface = "0.1.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[[bin]]
name = "treta-engine"
path = "src/bin/treta-engine.rs"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
